AllCops:
  TargetRubyVersion: 3.0
  NewCops: enable
  Exclude:
    - "lib/fysk/parser.rb"

Gemspec/RequireMFA:
  Enabled: false

Layout/LineLength:
  Enabled: false

Metrics:
  Enabled: false

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes
